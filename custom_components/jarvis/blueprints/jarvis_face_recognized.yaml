blueprint:
  name: JARVIS — Announce recognized faces
  description: >
    When DoubleTake recognizes a face on a camera, JARVIS announces who it is
    (or "an unknown person") and optionally analyzes what they're doing.
    Fires on the `jarvis_face_recognized` event.

    The event carries `trigger.event.data.relationship` — `resident` (a flagged
    household member), `guest` (a recognized person who isn't a resident) or
    `unknown` — plus the boolean `is_resident`, so your own automations can
    treat household and visitors differently (issue #388). Flag residents in the
    JARVIS panel → Faces.

    It also carries best-effort `is_indoor` and `residents_home` booleans (the
    camera's floor-plan placement, and whether a resident is tracked home while
    the alarm is not armed away), which the "Suppress indoor unknown alerts while
    residents are home" option below uses to avoid alerting on an unrecognised
    resident indoors (#41).
  domain: automation
  input:
    target_camera:
      name: Camera to filter on (optional)
      description: Leave blank to announce all recognitions across all cameras
      default: ""
      selector:
        text:
    greet_known:
      name: Greet known people by name
      description: Announce "Your [name] is at [location]"
      default: true
      selector:
        boolean:
    alert_unknown:
      name: Alert on unknown faces
      description: Announce and analyze when an unknown person is seen
      default: true
      selector:
        boolean:
    suppress_unknown_indoor_when_home:
      name: Suppress indoor unknown alerts while residents are home
      description: >-
        When on (default), an unknown face on an INDOOR camera is NOT alerted on
        while a household resident is tracked home — the common case of a
        resident the backend simply failed to recognise, or an invited guest. It
        relies on the event's `is_indoor` and `residents_home` flags (JARVIS sets
        both; `residents_home` is false when the alarm is armed away), and falls
        back to alerting whenever either is unknown. Outdoor cameras are
        unaffected and always alert on an unknown face. Turn this off to alert on
        every unknown face regardless of placement or presence.
      default: true
      selector:
        boolean:
    cooldown_seconds:
      name: Cooldown per person
      description: Don't re-announce the same person within this many seconds
      default: 300
      selector:
        number:
          min: 30
          max: 3600
          unit_of_measurement: seconds

trigger:
  - platform: event
    event_type: jarvis_face_recognized

mode: queued
max: 10

variables:
  target_cam: !input target_camera
  greet: !input greet_known
  alert_unk: !input alert_unknown
  suppress_indoor_home: !input suppress_unknown_indoor_when_home

condition:
  - condition: template
    value_template: >-
      {{ target_cam == "" or trigger.event.data.camera_entity == target_cam }}
  - condition: template
    value_template: >-
      {{ trigger.event.data.is_confident }}

action:
  - choose:
      - conditions:
          - condition: template
            value_template: >-
              {{ not trigger.event.data.is_unknown and greet }}
        sequence:
          - service: jarvis.analyze_on_event
            data:
              entity_id: "{{ trigger.event.data.camera_entity }}"
              reason: >-
                {{ trigger.event.data.name }} has been recognized at the
                {{ trigger.event.data.camera | replace('_', ' ') }}

      - conditions:
          - condition: template
            value_template: >-
              {{ trigger.event.data.is_unknown and alert_unk
                 and not (suppress_indoor_home
                          and (trigger.event.data.is_indoor | default(false))
                          and (trigger.event.data.residents_home | default(false))) }}
        sequence:
          - service: jarvis.analyze_on_event
            data:
              entity_id: "{{ trigger.event.data.camera_entity }}"
              reason: >-
                An unknown person has been detected at the
                {{ trigger.event.data.camera | replace('_', ' ') }} — describe them

  - delay:
      seconds: !input cooldown_seconds
